<title>Membuka Kasir Olano…</title>
<style>
:root{--blue-600:#2453EB;--ink:#0B1220;--gray-500:#6B7489}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#FAFBFD;color:var(--ink);min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
.box{max-width:340px;margin:auto}
.mark{width:44px;height:44px;border-radius:12px;background:var(--blue-600);display:grid;place-items:center;margin:0 auto 14px;color:#fff;font-weight:800;font-size:22px}
h1{font-size:1.1rem;font-weight:700}p{color:var(--gray-500);font-size:14px;margin-top:8px}
a{color:var(--blue-600);font-weight:600;font-size:14px}
.spin{width:22px;height:22px;border:2px solid #DBE8FE;border-top-color:var(--blue-600);border-radius:50%;margin:16px auto 0;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
  <meta property="og:title" content="Kasir Olano: Jualan Jalan walau Internet Mati">
  <meta property="og:description" content="Kasir offline PWA untuk UMKM: transaksi tetap tercatat saat sinyal hilang, QRIS, stok, dan rekap harian. Lompat otomatis saat online.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://olano.xyz/og-image.jpg">

  <meta property="og:image:height" content="630">

  <meta name="twitter:image" content="https://olano.xyz/og-image.jpg">
</head>
<body>
<div class="box">
  <div class="mark">O</div>
  <h1>Membuka Kasir Olano…</h1>
  <div class="spin"></div>
  <p>Kasir offline PWA. Kalau tidak lompat otomatis, <a href="app/kasir.html">buka di sini</a>.</p>
</div>
</body>
</html>
